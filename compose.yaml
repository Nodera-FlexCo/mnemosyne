name: mnemosyne

# Data layer for Mnemosyne (Postgres+pgvector, Redis).
# MCP servers, indexer, pgbouncer and cloudflared are added in later stages.
#
# Security model: DB/cache live on an internal-only network and are published
# ONLY to host loopback (127.0.0.1) for admin/migrations — never to 0.0.0.0.
# ufw-docker is installed on the host so even an accidental public publish is
# filtered. cloudflared (added later) is the only ingress.

x-restart: &restart
  restart: unless-stopped

networks:
  backend:
    internal: true        # no egress; DB/cache isolated
  edge: {}                # mcp servers (memory/codebase) + cloudflared + mnemo-auth
  loopback: {}            # non-internal, NOT shared with cloudflared — lets secrets-mcp
                          # keep its 127.0.0.1 host publish while staying unreachable from
                          # the tunnel (internal:true would block the loopback publish).

volumes:
  pgdata: {}
  redisdata: {}

services:
  postgres:
    image: pgvector/pgvector:pg17
    <<: *restart
    shm_size: "1g"                       # default 64MB breaks parallel/large queries
    command:
      - postgres
      - -c
      - listen_addresses=*
      # --- memory (128GB box, shared with other services) ---
      - -c
      - shared_buffers=32GB
      - -c
      - effective_cache_size=96GB
      - -c
      - work_mem=128MB
      - -c
      - maintenance_work_mem=4GB
      - -c
      - hash_mem_multiplier=2.0
      # --- parallelism (14C/20T) ---
      - -c
      - max_worker_processes=20
      - -c
      - max_parallel_workers=14
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - max_parallel_maintenance_workers=4
      # --- I/O (Gen4 NVMe) ---
      - -c
      - effective_io_concurrency=200
      - -c
      - maintenance_io_concurrency=200
      - -c
      - random_page_cost=1.1
      # --- WAL / checkpoints ---
      - -c
      - wal_level=replica
      - -c
      - max_wal_size=16GB
      - -c
      - min_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - checkpoint_timeout=15min
      - -c
      - wal_compression=zstd
      - -c
      - synchronous_commit=on            # non-ECC single box: keep durable
      # --- planner / misc ---
      - -c
      - default_statistics_target=200
      - -c
      - jit=off
      - -c
      - max_connections=200
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_INITDB_ARGS: "--data-checksums"   # extra corruption detection (non-ECC box)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"            # loopback ONLY (host-side psql/migrations)
    networks: [backend, edge]   # edge enables host-loopback publish (DBeaver + migrations/importer); Postgres makes no outbound calls
    mem_limit: 96g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    <<: *restart
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set in .env}
      - --maxmemory
      - 2gb
      - --maxmemory-policy
      - allkeys-lru               # pure cache (rerank + query-embedding); evict freely
      - --save
      - ""                         # no RDB snapshots (cache is reproducible)
      - --appendonly
      - "no"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"      # loopback ONLY
    networks: [backend]
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  memory-mcp:
    build: ./services/memory-mcp
    <<: *restart
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:?set in .env}
      MNEMO_TOKEN: ${MNEMO_TOKEN:-}
      DEFAULT_PROJECT_ID: ${DEFAULT_PROJECT_ID:-nodex}
      PORT: "8080"
      CANDIDATE_POOL: "25"
    ports:
      - "127.0.0.1:8080:8080"        # host-side Claude Code reaches it here
    networks: [backend, edge]         # backend=Postgres, edge=egress to Voyage
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  codebase-mcp:
    build: ./services/codebase-mcp
    <<: *restart
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:?set in .env}
      MNEMO_TOKEN: ${MNEMO_TOKEN:-}
      DEFAULT_PROJECT_ID: ${DEFAULT_PROJECT_ID:-nodex}
      PORT: "8081"
      REPOS_ROOT: /repos
    volumes:
      - /home/development/dev:/repos:ro   # repos mounted read-only for index + get_file
    ports:
      - "127.0.0.1:8081:8081"             # host-side Claude Code reaches it here
    networks: [backend, edge]              # backend=Postgres, edge=egress to Voyage
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  secrets-mcp:
    build: ./services/secrets-mcp
    <<: *restart
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:?set in .env}
      MNEMO_TOKEN: ${MNEMO_TOKEN:-}
      DEFAULT_PROJECT_ID: ${DEFAULT_PROJECT_ID:-nodex}
      PORT: "8082"
    ports:
      - "127.0.0.1:8082:8082"
    networks: [backend, loopback]       # backend=Postgres; loopback (non-internal) keeps the
                                         # 127.0.0.1:8082 host publish working WITHOUT putting secrets
                                         # on the cloudflared-shared `edge` net — so the tunnel can
                                         # never reach 8082 (no ingress route AND no shared network).
                                         # secrets-mcp makes NO outbound calls; loopback has no egress need.
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8082/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Public ingress — Cloudflare Tunnel (token mode). Outbound-only (dials OUT to Cloudflare;
  # no published host ports). Ingress is managed REMOTELY via the CF API (config_src=cloudflare):
  # ONLY memory + codebase are routed; there is NO secrets route, and secrets-mcp is additionally
  # off the `edge` net (see the loopback network) so the tunnel cannot reach it. Profile-gated:
  # stays DOWN under the default up (and systemd) until COMPOSE_PROFILES=edge is set in .env.
  cloudflared:
    image: cloudflare/cloudflared:2025.7.0   # TODO confirm/pin a digest before relying on it long-term
    <<: *restart
    profiles: ["edge"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set in .env}   # named-tunnel run token (from the CF API/dashboard)
    networks: [edge]                           # reaches memory-mcp + codebase-mcp by DNS; NOT secrets-mcp
    mem_limit: 256m
    depends_on:
      memory-mcp:
        condition: service_healthy
      codebase-mcp:
        condition: service_healthy
    # NO `ports:` — outbound tunnel only.

  # Eval/observability plane (Mnemosyne Stage 3 — the eval harness keystone).
  # Pinned to v2 ON PURPOSE: v2 is a single web container backed by Postgres only.
  # v3 mandates ClickHouse + Redis + S3 (heavy) — not wanted for this MVP. It runs its
  # own Prisma migrations into the `langfuse` DB on first boot. LANGFUSE_INIT_* headlessly
  # bootstraps the org/project/user + API keys so Promptfoo gets stable keys with no UI clicks.
  langfuse:
    image: langfuse/langfuse:2
    <<: *restart
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${LANGFUSE_DB:-langfuse}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set in .env}
      SALT: ${LANGFUSE_SALT:?set in .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set in .env}   # openssl rand -hex 32
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      # Headless bootstrap (first boot only) — stable keys for the Promptfoo CI gate.
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-mnemosyne}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-nodex-evals}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Mnemosyne}
    ports:
      - "127.0.0.1:3000:3000"        # loopback ONLY — reach via SSH tunnel (cloudflared later)
    networks: [backend, edge]          # backend=Postgres; edge for NextAuth/egress
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s              # first boot runs DB migrations
